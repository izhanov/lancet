[workspace]
members = ["lib", "cli"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
# wasmtime (tree-sitter grammars as WebAssembly) needs 1.95
rust-version = "1.95"
license = "MIT"

# Drops symbols: lt shrinks from ~240 to ~200 MB; the rest is lance,
# datafusion and arrow code.
[profile.release]
strip = true

# Release assets only (see .github/workflows/release.yml): lt shrinks from
# ~210 to ~125 MB, its tar.gz from ~80 to ~55 MB. A clean build takes
# ~15 min on an M5 and every change relinks the whole binary, so local
# `--release` builds stay without it.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[workspace.dependencies]
lancet-lib = { path = "lib" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
futures = "0.3"
ignore = "0.4"
# "remote": since 0.38 lancedb does not compile without it (Error::Http is used ungated in job.rs)
lancedb = { version = "0.40", features = ["remote"] }
quick-xml = "0.42"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.7", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# "wasm": language plugins ship their grammar as WebAssembly (see lib/src/lang.rs)
tree-sitter = { version = "0.27", features = ["wasm"] }
wiremock = "0.6"
zip = { version = "9", default-features = false, features = ["deflate"] }
