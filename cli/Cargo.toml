[package]
name = "lancet-cli"
description = "Lancet command line: local semantic search over your files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lt"
path = "src/main.rs"

[dependencies]
lancet-lib.workspace = true
anyhow = { workspace = true, features = ["std"] }
chrono = { workspace = true, features = ["alloc"] }
clap = { workspace = true, features = [
    "std",
    "color",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
    "env",
] }
rmcp = { workspace = true, features = ["base64", "macros", "server", "transport-io"] }
schemars = { workspace = true, features = ["std", "derive"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = [
    "std",
    "fmt",
    "ansi",
    "smallvec",
    "tracing-log",
    "env-filter",
] }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
tempfile = { workspace = true, features = ["getrandom"] }
