[workspace]
members = ["lib", "cli"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
# wasmtime (tree-sitter grammars as WebAssembly) needs 1.95
rust-version = "1.95"
license = "MIT"

# Drops symbols: lt shrinks from ~240 to ~200 MB; the rest is lance,
# datafusion and arrow code.
[profile.release]
strip = true

# Release assets only (see .github/workflows/release.yml): lt shrinks from
# ~210 to ~140 MB, its tar.gz from ~80 to ~55 MB. Thin, not fat: fat LTO
# saves 1 MB of tar.gz more but runs ~13 min on an M5 instead of ~8, and on
# CI it killed the 16 GB linux arm64 runner and starved the macOS ones.
# Thin still peaks at ~11 GB and every change relinks the whole binary, so
# local `--release` builds stay without it.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

# Versions only, with default features off: each crate names the features
# it uses in its own Cargo.toml, so a dependency's new default never slips
# in unnoticed.
[workspace.dependencies]
lancet-lib = { path = "lib" }

anyhow = { version = "1", default-features = false }
async-trait = { version = "0.1", default-features = false }
chrono = { version = "0.4", default-features = false }
clap = { version = "4", default-features = false }
csv = { version = "1", default-features = false }
futures = { version = "0.3", default-features = false }
ignore = { version = "0.4", default-features = false }
lancedb = { version = "0.40", default-features = false }
quick-xml = { version = "0.42", default-features = false }
regex = { version = "1", default-features = false }
reqwest = { version = "0.12", default-features = false }
rmcp = { version = "3.7", default-features = false }
schemars = { version = "1", default-features = false }
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
serde_norway = { version = "0.9", default-features = false }
sha2 = { version = "0.10", default-features = false }
tempfile = { version = "3", default-features = false }
thiserror = { version = "2", default-features = false }
toml = { version = "1", default-features = false }
tokio = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
tree-sitter = { version = "0.27", default-features = false }
wiremock = { version = "0.6", default-features = false }
zip = { version = "9", default-features = false }
