[workspace]
members = ["lib", "cli", "server"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"

# Drops symbols: lt shrinks from ~240 to ~200 MB; the rest is lance,
# datafusion and arrow code.
[profile.release]
strip = true

[workspace.dependencies]
lancet-lib = { path = "lib" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
futures = "0.3"
ignore = "0.4"
# "remote": since 0.38 lancedb does not compile without it (Error::Http is used ungated in job.rs)
lancedb = { version = "0.40", features = ["remote"] }
quick-xml = "0.42"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.7", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
zip = { version = "9", default-features = false, features = ["deflate"] }
