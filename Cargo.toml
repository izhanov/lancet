[workspace]
members = ["lib", "cli", "server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
lancet-lib = { path = "lib" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
# "remote": since 0.38 lancedb does not compile without it (Error::Http is used ungated in job.rs)
lancedb = { version = "0.40", features = ["remote"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
wiremock = "0.6"
